<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="doc-title">Meu Estudo — Preparação Intensiva (UTFPR-PG)</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-subtle: #f9fafb;
      --surface-muted: #f1f5f9;
      --border: #e5e7eb;
      --border-strong: #d1d5db;
      --ink: #111827;
      --muted: #4b5563;
      --subtle: #6b7280;
      --primary: #0f4c81;
      --primary-hover: #0b3a63;
      --primary-soft: #edf4fa;
      --primary-border: #bfd6ea;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --ok-border: #bbf7d0;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --warn-border: #fde68a;
      --err: #b91c1c;
      --err-bg: #fee2e2;
      --err-border: #fecaca;
      --radius: 14px;
      --radius-sm: 10px;
      --font-sans: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: Consolas, ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: clip;
    }

    button, input, select { font-family: inherit; }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    select:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .preview-banner {
      background: var(--primary-soft);
      border-bottom: 1px solid var(--primary-border);
      color: var(--primary);
      padding: 10px 16px;
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .preview-banner a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .app-shell {
      max-width: 780px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    /* Cabeçalho limpo e compacto */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .topbar-id {
      min-width: 0;
      flex: 1;
    }
    .topbar-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.25;
    }
    .topbar-sub {
      margin: 2px 0 0;
      font-size: 0.875rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .disc-select {
      min-height: 40px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: 0.875rem;
      font-weight: 600;
      max-width: 240px;
    }
    .btn-ghost {
      min-height: 40px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-ghost:hover { background: var(--surface-muted); }

    /* Abas principais: Hoje | Resultados | Progresso */
    .tablist {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .tab-btn {
      min-height: 44px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 10px;
      transition: background-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }
    .tab-btn:hover { color: var(--ink); }
    .tab-btn[aria-selected="true"] {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.06);
    }
    .tab-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--warn-bg);
      color: var(--warn);
    }

    .panel[hidden] { display: none; }

    /* Superfícies e hierarquia */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 16px;
    }
    .card-quiet {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .activity-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .activity-title {
      margin: 0;
      font-size: 1.32rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--ink);
      line-height: 1.3;
      max-width: 60ch;
    }
    .activity-sub {
      margin: 6px 0 0;
      font-size: 0.94rem;
      color: var(--muted);
      max-width: 68ch;
    }
    .meta-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.81rem;
      font-weight: 600;
      background: var(--surface-muted);
      color: var(--muted);
    }
    .pill-primary { background: var(--primary-soft); color: var(--primary); }
    .pill-ok { background: var(--ok-bg); color: var(--ok); }
    .pill-warn { background: var(--warn-bg); color: var(--warn); }
    .pill-err { background: var(--err-bg); color: var(--err); }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 18px 0;
      border: 0;
    }

    /* Área de ação principal */
    .action-stage {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .stage-lead {
      margin: 0;
      font-size: 0.95rem;
      color: var(--ink);
      max-width: 65ch;
    }
    .stage-lead strong { font-weight: 600; }

    .timer-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 18px;
      border-radius: var(--radius-sm);
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
    }
    .timer-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
    }
    .timer-meta {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
    }

    /* Botões: apenas 1 cor primária forte */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .btn {
      min-height: 46px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
      text-decoration: none;
    }
    .btn:active:not(:disabled) { transform: scale(0.99); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-muted); }
    .btn-sm {
      min-height: 38px;
      padding: 7px 12px;
      font-size: 0.85rem;
    }

    /* Zona de upload com prévia real */
    .upload-box {
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-subtle);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .file-preview-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }
    .file-thumb {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      flex-shrink: 0;
    }
    .file-pdf-badge {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .file-info {
      min-width: 0;
      flex: 1;
    }
    .file-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .upload-assoc {
      font-size: 0.84rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }

    /* Stepper de correção em andamento */
    .job-card {
      border: 1px solid var(--primary-border);
      background: var(--primary-soft);
      border-radius: var(--radius-sm);
      padding: 16px;
    }
    .job-steps {
      list-style: none;
      margin: 12px 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .job-step {
      font-size: 0.8rem;
      padding: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--subtle);
      border: 1px solid var(--border);
      text-align: center;
      font-weight: 600;
    }
    .job-step.done {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: var(--ok-border);
    }
    .job-step.active {
      background: var(--surface);
      color: var(--primary);
      border-color: var(--primary);
    }

    /* Details discretos */
    details.quiet-details {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 14px;
    }
    details.quiet-details > summary {
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 36px;
    }
    details.quiet-details > summary::-webkit-details-marker { display: none; }
    details.quiet-details > summary::after {
      content: "+";
      font-size: 1rem;
      color: var(--subtle);
    }
    details.quiet-details[open] > summary::after { content: "−"; }
    .details-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      font-size: 0.86rem;
    }
    .detail-kv {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .detail-kv span { display: block; color: var(--subtle); font-size: 0.78rem; }
    .detail-kv strong { color: var(--ink); font-weight: 600; }

    /* Resultados */
    .result-hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .section-label {
      margin: 18px 0 10px;
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--ink);
    }
    .q-card {
      border: 1px solid var(--border);
      border-left: 4px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .q-card.ok { border-left-color: var(--ok); }
    .q-card.warn { border-left-color: var(--warn); }
    .q-card.err { border-left-color: var(--err); }
    .q-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .q-id { font-weight: 700; font-size: 0.95rem; }
    .q-answer {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
      margin-bottom: 8px;
      overflow-x: auto;
    }
    .math-matrix {
      display: inline-table;
      border-left: 2px solid var(--ink);
      border-right: 2px solid var(--ink);
      border-radius: 4px;
      padding: 2px 6px;
      margin: 2px 4px;
      font-family: var(--font-mono);
      vertical-align: middle;
    }
    .math-matrix td {
      padding: 2px 7px;
      text-align: center;
      border: 0;
    }
    .q-fb { font-size: 0.9rem; color: var(--muted); margin: 0; }

    /* Progresso */
    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--surface-muted);
      overflow: hidden;
      margin: 12px 0;
    }
    .progress-fill {
      height: 100%;
      background: var(--ok);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .stages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .stage-chip {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      font-size: 0.8rem;
      background: var(--surface-subtle);
      color: var(--muted);
    }
    .stage-chip.concluido { background: var(--ok-bg); border-color: var(--ok-border); color: var(--ok); font-weight: 600; }
    .stage-chip.em_andamento { background: var(--primary-soft); border-color: var(--primary-border); color: var(--primary); font-weight: 700; }

    .chart-box {
      margin-top: 10px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
    }
    .chart-detail {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 20px;
    }

    /* Histórico: tabela desktop + cartões mobile */
    .hist-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      margin-top: 8px;
    }
    .hist-table th, .hist-table td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }
    .hist-table th { color: var(--muted); font-weight: 600; }
    .hist-mobile { display: none; margin-top: 8px; }
    .hist-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      background: var(--surface-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .status-inline {
      font-size: 0.88rem;
      color: var(--primary);
      font-weight: 500;
      min-height: 20px;
    }
    .status-inline.err { color: var(--err); }
    .mono { font-family: var(--font-mono); font-size: 0.88em; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 640px) {
      .app-shell { padding: 14px 12px 36px; }
      .topbar { flex-direction: column; align-items: stretch; }
      .topbar-controls { justify-content: space-between; width: 100%; }
      .disc-select { flex: 1; max-width: none; }
      .card { padding: 16px; border-radius: 12px; }
      .activity-title { font-size: 1.15rem; }
      .timer-value { font-size: 1.9rem; }
      .btn-row { flex-direction: column; align-items: stretch; }
      .btn-row .btn { width: 100%; }
      .job-steps { grid-template-columns: repeat(2, 1fr); }
      .hist-table { display: none; }
      .hist-mobile { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="preview-bar" class="preview-banner" hidden>
    <span id="preview-texto">Visualizando o portal do aluno</span>
    <a id="link-voltar-admin" href="/admin">Voltar ao Painel Gerencial</a>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-id">
        <h1 class="topbar-title" id="titulo-portal">Meu Estudo</h1>
        <p class="topbar-sub" id="subtitulo-aluno">Carregando seus dados...</p>
      </div>
      <div class="topbar-controls">
        <label for="sel-disciplina" class="sr-only">Disciplina ativa</label>
        <select id="sel-disciplina" class="disc-select" hidden onchange="trocarDisciplinaAluno(this.value)"></select>
        <button type="button" class="btn-ghost" onclick="sair()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </button>
      </div>
    </header>

    <nav class="tablist" role="tablist" aria-label="Áreas do portal">
      <button type="button" class="tab-btn" role="tab" id="tab-hoje" aria-selected="true" aria-controls="pane-hoje" tabindex="0" onclick="ativarAba('hoje')">Hoje</button>
      <button type="button" class="tab-btn" role="tab" id="tab-resultados" aria-selected="false" aria-controls="pane-resultados" tabindex="-1" onclick="ativarAba('resultados')">
        Resultados <span class="tab-count" id="badge-revisao" hidden>0</span>
      </button>
      <button type="button" class="tab-btn" role="tab" id="tab-progresso" aria-selected="false" aria-controls="pane-progresso" tabindex="-1" onclick="ativarAba('progresso')">Progresso</button>
    </nav>

    <main>
      <section id="pane-hoje" class="panel" role="tabpanel" aria-labelledby="tab-hoje"></section>
      <section id="pane-resultados" class="panel" role="tabpanel" aria-labelledby="tab-resultados" hidden></section>
      <section id="pane-progresso" class="panel" role="tabpanel" aria-labelledby="tab-progresso" hidden></section>
    </main>
  </div>

  <script>
    window.__INITIAL_STATE__ = __INITIAL_STATE_JSON__;
    let ESTADO = window.__INITIAL_STATE__ || null;
    let DISCIPLINA_ATIVA = (ESTADO && ESTADO.disciplina_ativa && ESTADO.disciplina_ativa.id) || "algoritmos";
    let ABA_ATIVA = "hoje";

    let cronInterval = null;
    let cronBaseSeg = 0;
    let cronAnchorMs = 0;

    let selectedFile = null;
    let selectedPreviewUrl = "";
    let selectedProtocolo = "";

    let jobAtivo = null;
    let jobPollTimer = null;
    let lastRenderSig = "";
    let chartPointSelectedIdx = -1;

    const ICONS = {
      doc: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
      play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>',
      check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
      upload: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
      camera: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
      eye: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'
    };

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[m]));
    }

    function parseIsoMs(isoStr) {
      if (!isoStr) return NaN;
      const clean = String(isoStr).trim().replace(" ", "T");
      return Date.parse(clean);
    }

    function formatarTimer(segTotal) {
      const s = Math.max(0, Math.floor(segTotal || 0));
      const mm = String(Math.floor(s / 60)).padStart(2, "0");
      const ss = String(s % 60).padStart(2, "0");
      return `${mm}:${ss}`;
    }

    function formatarBytes(bytes) {
      if (!bytes || bytes < 1024) return `${bytes || 0} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function storageKeyJob(discId) {
      const aid = (ESTADO && ESTADO.aluno && ESTADO.aluno.id) || "0";
      return `prep_job_${aid}_${discId}`;
    }

    function salvarJobStorage(job) {
      try {
        if (job && job.job_id) {
          sessionStorage.setItem(storageKeyJob(DISCIPLINA_ATIVA), JSON.stringify(job));
        } else {
          sessionStorage.removeItem(storageKeyJob(DISCIPLINA_ATIVA));
        }
      } catch (_e) {}
    }

    function carregarJobStorage() {
      try {
        const raw = sessionStorage.getItem(storageKeyJob(DISCIPLINA_ATIVA));
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (_e) {
        return null;
      }
    }

    function traduzirModo(modo, variante) {
      if (modo === "checagem") {
        return variante === "V2" ? "Checagem independente (V2)" : "Checagem independente";
      }
      return variante === "V2" ? "Prática guiada (V2)" : "Prática guiada";
    }

    function traduzirProximaAcao(acao, destino) {
      const s = String(acao || "");
      if (s.startsWith("AVANCAR_")) return `Domínio concluído. Próximo bloco liberado: ${destino}.`;
      if (s.startsWith("CHECAGEM_")) return `Prática aprovada em ${destino}. Próxima etapa: checagem independente.`;
      if (s.startsWith("REFAZER_PRATICA")) return `Revise os pontos indicados antes de tentar a próxima etapa.`;
      if (s.startsWith("RECUPERACAO_V2")) return `Nova tentativa liberada em ${destino} (Variante V2).`;
      if (s.startsWith("RECUO_PREREQUISITO")) return `Reforce primeiro a base em ${destino} antes de retornar.`;
      return s || "Acompanhe as orientações abaixo.";
    }

    function formatarRespostaVisual(texto) {
      const t = String(texto || "").trim();
      if (!t) return '<span style="color:var(--subtle);">(em branco)</span>';
      // Formata matrizes no formato [[1, 2], [3, 4]] em tabela visual alinhada
      const comMatriz = escapeHtml(t).replace(/\[\[\s*-?[\d./a-zA-Z]+(?:\s*,\s*-?[\d./a-zA-Z]+)*\s*\](?:\s*,\s*\[\s*-?[\d./a-zA-Z]+(?:\s*,\s*-?[\d./a-zA-Z]+)*\s*\])*\]/g, (m) => {
        try {
          const rows = m.slice(1, -1).split(/\]\s*,\s*\[/).map(r => r.replace(/[\[\]]/g, "").split(",").map(c => c.trim()));
          const trs = rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("");
          return `<table class="math-matrix" aria-label="Matriz">${trs}</table>`;
        } catch (_e) {
          return m;
        }
      });
      return `<div style="white-space:pre-wrap; word-break:break-word;">${comMatriz}</div>`;
    }

    function estadoAssinatura(st) {
      if (!st) return "";
      const copia = Object.assign({}, st);
      delete copia.servidor_agora_iso;
      return JSON.stringify(copia);
    }

    function pararCronometroVisual() {
      if (cronInterval) {
        clearInterval(cronInterval);
        cronInterval = null;
      }
    }

    function atualizarTextoCronometro() {
      const el = document.getElementById("timer-live");
      if (!el) return;
      const elapsed = cronBaseSeg + Math.max(0, Math.floor((Date.now() - cronAnchorMs) / 1000));
      el.textContent = formatarTimer(elapsed);
    }

    function sincronizarCronometroServidor() {
      pararCronometroVisual();
      const prova = ESTADO && ESTADO.prova_atual;
      if (!prova || prova.status === "corrigida") return;
      if (prova.inicio_cronometro_em && !prova.fim_cronometro_em && !(prova.tempo_cronometrado_min > 0)) {
        const iniMs = parseIsoMs(prova.inicio_cronometro_em);
        const srvNowMs = parseIsoMs(ESTADO.servidor_agora_iso) || Date.now();
        cronBaseSeg = !isNaN(iniMs) && !isNaN(srvNowMs) ? Math.max(0, Math.floor((srvNowMs - iniMs) / 1000)) : 0;
        cronAnchorMs = Date.now();
        cronInterval = setInterval(atualizarTextoCronometro, 1000);
      }
    }

    function determinarEstadoSessao() {
      if (jobAtivo && ["enviando", "arquivo_recebido", "lendo_e_corrigindo"].includes(jobAtivo.etapa)) {
        return "corrigindo";
      }
      const prova = ESTADO && ESTADO.prova_atual;
      const alSt = ESTADO && ESTADO.aluno && ESTADO.aluno.status_curso;
      if (!prova || prova.status === "corrigida") {
        if (alSt === "CONCLUIDO") {
          return "disciplina_concluida";
        }
        return ESTADO && ESTADO.ultima_submissao ? "concluida_sem_nova" : "sem_atividade";
      }
      if (prova.tempo_cronometrado_min > 0 || prova.fim_cronometro_em) {
        return "resolucao_concluida";
      }
      if (prova.inicio_cronometro_em) {
        return "em_andamento";
      }
      return "disponivel";
    }

    function ativarAba(aba) {
      if (!["hoje", "resultados", "progresso"].includes(aba)) return;
      ABA_ATIVA = aba;
      ["hoje", "resultados", "progresso"].forEach(id => {
        const btn = document.getElementById(`tab-${id}`);
        const pane = document.getElementById(`pane-${id}`);
        const ativo = id === aba;
        btn.setAttribute("aria-selected", ativo ? "true" : "false");
        btn.setAttribute("tabindex", ativo ? "0" : "-1");
        pane.hidden = !ativo;
      });
    }

    document.querySelector(".tablist").addEventListener("keydown", (e) => {
      const ordem = ["hoje", "resultados", "progresso"];
      const idx = ordem.indexOf(ABA_ATIVA);
      if (idx < 0) return;
      let nextIdx = -1;
      if (e.key === "ArrowRight") nextIdx = (idx + 1) % ordem.length;
      else if (e.key === "ArrowLeft") nextIdx = (idx - 1 + ordem.length) % ordem.length;
      else if (e.key === "Home") nextIdx = 0;
      else if (e.key === "End") nextIdx = ordem.length - 1;
      if (nextIdx >= 0) {
        e.preventDefault();
        ativarAba(ordem[nextIdx]);
        document.getElementById(`tab-${ordem[nextIdx]}`).focus();
      }
    });

    function renderizarCabecalho() {
      const al = ESTADO.aluno;
      const disc = ESTADO.disciplina_ativa || { id: "algoritmos", codigo: "CC61A", nome: "Algoritmos em C", total_blocos: 73 };
      DISCIPLINA_ATIVA = disc.id || DISCIPLINA_ATIVA;

      document.title = `Meu Estudo — ${disc.nome} (${disc.codigo})`;
      document.getElementById("titulo-portal").textContent = `${disc.nome} (${disc.codigo})`;
      document.getElementById("subtitulo-aluno").textContent = `${al.nome} • ${al.email}`;

      const prevBar = document.getElementById("preview-bar");
      if (ESTADO.is_admin_preview) {
        prevBar.hidden = false;
        document.getElementById("preview-texto").textContent = `Visualizando como: ${al.nome} (${al.email})`;
        document.getElementById("link-voltar-admin").href = `/admin?disciplina=${encodeURIComponent(DISCIPLINA_ATIVA)}&aluno_id=${al.id}`;

      }

          }).join("");

        }).join("");
      } else {
        selDisc.hidden = true;
      }

      const sub = ESTADO.ultima_submissao;
      const badgeRev = document.getElementById("badge-revisao");
      const qtdRev = sub ? (sub.itens || []).filter(i => i.status_correcao !== "correto").length : 0;
      if (qtdRev > 0) {
        badgeRev.hidden = false;
        badgeRev.textContent = String(qtdRev);
      } else {
        badgeRev.hidden = true;
      }
    }

    function renderizarHoje() {
      const pane = document.getElementById("pane-hoje");
      const al = ESTADO.aluno;
      const prog = ESTADO.progresso || {};
      const prova = ESTADO.prova_atual;
      const recentes = ESTADO.provas_recentes || (prova ? [prova] : []);
      const situacao = determinarEstadoSessao();
      const titulo = prog.titulo_bloco_atual || `Bloco ${al.bloco_atual}`;

      if (prova && prova.status !== "corrigida") {

      if (!sub) {
        pane.innerHTML = `
          <div class="card">
            <h2 class="activity-title" style="font-size:1.1rem;">Nenhuma correção registrada</h2>
            <p class="activity-sub">Assim que sua primeira atividade for corrigida, o resultado e o retorno questão a questão aparecerão aqui.</p>
          </div>
        `;
        return;
      }

      const okTotal = sub.percentual_acerto >= 100;
      const itens = sub.itens || [];
      const revisar = itens.filter(it => it.status_correcao !== "correto");
      const corretos = itens.filter(it => it.status_correcao === "correto");

      const renderQuestao = (it) => {
        const ehOk = it.status_correcao === "correto";
        const ehParcial = it.status_correcao === "parcial";
        const clsCard = ehOk ? "ok" : (ehParcial ? "warn" : "err");
        const clsPill = ehOk ? "pill-ok" : (ehParcial ? "pill-warn" : "pill-err");
        const lblStatus = ehOk ? "Correta" : (ehParcial ? "Revisar parcial" : "Revisar");
        return `
          <div class="q-card ${clsCard}">
            <div class="q-head">
              <span class="q-id">Questão ${escapeHtml(it.questao_id)}</span>
              <span class="pill ${clsPill}">${lblStatus}</span>
            </div>
            <div class="q-answer">${formatarRespostaVisual(it.resposta_extraida)}</div>
            <p class="q-fb">${escapeHtml(it.feedback_item)}</p>
            ${it.resposta_extraida ? `
              <details class="quiet-details" style="margin-top:8px;padding-top:8px;">
                <summary style="font-size:0.8rem;min-height:28px;">Ver transcrição bruta lida</summary>
                <pre class="mono" style="margin:6px 0 0;white-space:pre-wrap;font-size:0.8rem;color:var(--muted);">${escapeHtml(it.resposta_extraida)}</pre>
              </details>
            ` : ""}
          </div>
        `;
      };

      const revisarHtml = revisar.length > 0 ? `
        <h3 class="section-label">Para revisar (${revisar.length})</h3>
        ${revisar.map(renderQuestao).join("")}
      ` : "";

      const corretosHtml = corretos.length > 0 ? (
        revisar.length === 0 ? `
          <h3 class="section-label">Questões corretas (${corretos.length})</h3>
          ${corretos.map(renderQuestao).join("")}
        ` : `
          <details class="quiet-details" style="border-top:0;margin-top:14px;">
            <summary>Ver ${corretos.length} ${corretos.length === 1 ? "questão correta" : "questões corretas"}</summary>
            <div style="margin-top:10px;">${corretos.map(renderQuestao).join("")}</div>
          </details>
        `
      ) : "";

      pane.innerHTML = `
        <article class="card">
          <div class="result-hero">
            <div>
              <h2 class="activity-title" style="font-size:1.15rem;">Bloco ${escapeHtml(sub.bloco)} (${escapeHtml(sub.variante)} • Tentativa #${sub.tentativa})</h2>
              <p class="activity-sub">${escapeHtml(traduzirProximaAcao(sub.proxima_acao, sub.bloco_destino))}</p>
            </div>
            <span class="pill ${okTotal ? "pill-ok" : "pill-warn"}" style="font-size:0.9rem;padding:6px 12px;">
              ${sub.acertos_iniciais}/${sub.total_questoes} (${sub.percentual_acerto}%)
            </span>
          </div>
          <div class="meta-pills" style="margin-top:8px;">
            <span class="pill">Tempo registrado: ${sub.tempo_declarado_min} min</span>
            <span class="pill">${escapeHtml(traduzirModo(sub.modo, sub.variante))}</span>
          </div>
          ${revisarHtml}
          ${corretosHtml}
        </article>
      `;
    }

    function selecionarPontoGrafico(idx) {
      chartPointSelectedIdx = idx;
      const hist = (ESTADO && ESTADO.historico_evolucao) || [];
      const rec = hist.slice(-8);
      const item = rec[idx];
      const info = document.getElementById("chart-detail-info");
      if (info && item) {
        info.textContent = `${item.data} • Bloco ${item.bloco} (${item.variante}): ${item.acertos_iniciais}/${item.total_questoes} (${item.percentual_acerto}%) em ${item.tempo_declarado_min} min`;
      }
    }

    function renderizarProgresso() {
      const pane = document.getElementById("pane-progresso");
      const prog = ESTADO.progresso || {};
      const disc = ESTADO.disciplina_ativa || { total_blocos: 60 };
      const dom = prog.blocos_dominados || 0;
      const tot = prog.total_blocos || disc.total_blocos || 60;
      const pct = prog.percentual_curso || 0;

      const estagiosHtml = (prog.estagios_resumo || []).map(st => `
        <div class="stage-chip ${escapeHtml(st.status)}" title="${escapeHtml(st.descricao)}">
          <div>Estágio ${escapeHtml(st.estagio)}</div>
          <div>${st.dominados}/${st.total}</div>
        </div>
      `).join("");

      const hist = ESTADO.historico_evolucao || [];
      const recChart = hist.slice(-8);
      let graficoHtml = `<p style="margin:6px 0 0;font-size:0.9rem;color:var(--muted);">Seu gráfico aparecerá após a primeira avaliação corrigida.</p>`;
      if (recChart.length > 0) {
        const w = 480, h = 156, pad = 28;
        const n = recChart.length;
        const pts = recChart.map((s, i) => {
          const x = n === 1 ? w / 2 : pad + (i * (w - 2 * pad)) / (n - 1);
          const y = h - pad - ((s.percentual_acerto / 100) * (h - 2 * pad));
          return { x, y, pct: s.percentual_acerto, label: s.bloco, idx: i };
        });
        const poly = pts.map(p => `${p.x},${p.y}`).join(" ");
        const dots = pts.map(p => `
          <g style="cursor:pointer;" onclick="selecionarPontoGrafico(${p.idx})">
            <circle cx="${p.x}" cy="${p.y}" r="12" fill="transparent" />
            <circle cx="${p.x}" cy="${p.y}" r="5.5" fill="${p.pct >= 100 ? "#15803d" : "#b45309"}" stroke="#ffffff" stroke-width="2" />
            <text x="${p.x}" y="${p.y - 11}" fill="#111827" font-size="11" font-weight="600" text-anchor="middle">${p.pct}%</text>
            <text x="${p.x}" y="${h - 7}" fill="#4b5563" font-size="11" text-anchor="middle">${escapeHtml(p.label)}</text>
          </g>
        `).join("");
        const ult = recChart[chartPointSelectedIdx >= 0 && chartPointSelectedIdx < recChart.length ? chartPointSelectedIdx : recChart.length - 1];
        graficoHtml = `
          <div class="chart-box">
            <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;" role="img" aria-label="Evolução das últimas ${recChart.length} avaliações">
              <line x1="${pad}" y1="${pad}" x2="${w - pad}" y2="${pad}" stroke="#15803d" stroke-dasharray="4" stroke-opacity="0.4" />
              <polyline fill="none" stroke="#0f4c81" stroke-width="2.5" points="${poly}" />
              ${dots}
            </svg>
            <div class="chart-detail" id="chart-detail-info">
              ${escapeHtml(ult.data)} • Bloco ${escapeHtml(ult.bloco)} (${escapeHtml(ult.variante)}): ${ult.acertos_iniciais}/${ult.total_questoes} (${ult.percentual_acerto}%) em ${ult.tempo_declarado_min} min
            </div>
          </div>
        `;
      }

      const histRev = hist.slice().reverse();
      const tabelaDesktop = histRev.length ? `
        <table class="hist-table">
          <thead>
            <tr><th>Data</th><th>Bloco</th><th>Tempo</th><th>Nota</th><th>Status</th></tr>
          </thead>
          <tbody>
            ${histRev.map(hItem => `
              <tr>
                <td>${escapeHtml(hItem.data)}</td>
                <td><strong>${escapeHtml(hItem.bloco)}</strong> (${escapeHtml(hItem.variante)})</td>
                <td>${hItem.tempo_declarado_min} min</td>
                <td>${hItem.acertos_iniciais}/${hItem.total_questoes} (${hItem.percentual_acerto}%)</td>
                <td><span class="pill ${hItem.aprovado ? "pill-ok" : "pill-warn"}">${hItem.aprovado ? "Aprovado" : "Em reforço"}</span></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <div class="hist-mobile">
          ${histRev.map(hItem => `
            <div class="hist-card">
              <div>
                <strong>Bloco ${escapeHtml(hItem.bloco)} (${escapeHtml(hItem.variante)})</strong>
                <div style="font-size:0.82rem;color:var(--muted);">${escapeHtml(hItem.data)} • ${hItem.tempo_declarado_min} min</div>
              </div>
              <div style="text-align:right;">
                <div style="font-weight:700;font-size:0.9rem;">${hItem.acertos_iniciais}/${hItem.total_questoes} (${hItem.percentual_acerto}%)</div>
                <span class="pill ${hItem.aprovado ? "pill-ok" : "pill-warn"}">${hItem.aprovado ? "Aprovado" : "Em reforço"}</span>
              </div>
            </div>
          `).join("")}
        </div>
      ` : "";

      pane.innerHTML = `
        <article class="card">
          <div class="activity-head">
            <h2 class="activity-title" style="font-size:1.12rem;">Domínio do curso</h2>
            <span class="pill pill-primary">${dom} de ${tot} blocos (${pct}%)</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${dom}">
            <div class="progress-fill" style="width:${Math.max(dom > 0 ? 4 : 0, pct)}%;"></div>
          </div>
          ${prog.total_avaliacoes > 0 ? `
            <p style="margin:0;font-size:0.88rem;color:var(--muted);">
              Média geral: <strong>${prog.media_acerto_pct}%</strong> • Tempo médio: <strong>${prog.tempo_medio_min} min</strong>
            </p>
          ` : ""}
          <div class="stages-grid">${estagiosHtml}</div>
        </article>

        <article class="card">
          <h2 class="activity-title" style="font-size:1.1rem;">Últimas avaliações${recChart.length ? ` (${recChart.length})` : ""}</h2>
          ${graficoHtml}
          ${tabelaDesktop ? `
            <details class="quiet-details">
              <summary>Histórico completo (${histRev.length})</summary>
              ${tabelaDesktop}
            </details>
          ` : ""}
        </article>

        ${(ESTADO.grade_bcc && (ESTADO.grade_bcc.periodos || []).length) ? `
          <article class="card">
            <details class="quiet-details" style="margin-top:0;border-top:0;padding-top:0;">
              <summary>Grade Completa BCC (1º ao 8º período) e Integralização (${ESTADO.grade_bcc.disciplinas_matriculadas_qtd || 0}/${ESTADO.grade_bcc.total_disciplinas || 34} mat.)</summary>
              <div style="margin-top:10px;display:grid;gap:8px;">
                ${(ESTADO.grade_bcc.periodos || []).map(p => `
                  <div style="padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);">
                    <div style="display:flex;justify-content:space-between;font-size:0.86rem;font-weight:700;margin-bottom:4px;">
                      <span>${escapeHtml(p.titulo)}</span>
                      <span style="color:var(--muted);">${p.concluidas}/${p.total} concluídas (${p.matriculadas} mat.)</span>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:6px;">
                      ${(p.disciplinas || []).map(d => {
                        const cls = d.status_aluno === "concluida" ? "pill-ok" : (d.matriculada ? "pill-primary" : "");
                        return `<span class="pill ${cls}" style="font-size:0.75rem;">${escapeHtml(d.nome)} (${d.matriculada ? escapeHtml(d.bloco_atual) : d.carga_horaria + "h"})</span>`;
                      }).join("")}
                    </div>
                  </div>
                `).join("")}
                ${(ESTADO.integralizacao || []).length ? `
                  <div style="padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);">
                    <strong style="font-size:0.86rem;display:block;margin-bottom:6px;">Integralização Curricular (PPC 2022)</strong>
                    <div style="display:grid;gap:4px;font-size:0.82rem;">
                      ${(ESTADO.integralizacao || []).map(c => `
                        <div style="display:flex;justify-content:space-between;gap:8px;">
                          <span>${escapeHtml(c.nome)}</span>
                          <strong>${c.horas_cumpridas} / ${c.horas_exigidas}h (${c.percentual}%)</strong>
                        </div>
                      `).join("")}
                    </div>
                  </div>
                ` : ""}
              </div>
            </details>
          </article>
        ` : ""}
      `;
    }

    function renderizarTudo(forcar = false) {
      if (!ESTADO || !ESTADO.aluno) return;
      const sig = estadoAssinatura(ESTADO) + "|" + JSON.stringify(jobAtivo ? { j: jobAtivo.job_id, e: jobAtivo.etapa } : null) + "|" + (selectedFile ? selectedFile.name + selectedFile.size : "");
      if (!forcar && sig === lastRenderSig) return;
      lastRenderSig = sig;

      renderizarCabecalho();
      sincronizarCronometroServidor();
      renderizarHoje();
      renderizarResultados();
      renderizarProgresso();
    }

    async function recarregarEstado(discOverride = null, forcar = false) {
      if (discOverride) DISCIPLINA_ATIVA = discOverride;
      const params = new URLSearchParams(window.location.search || "");
      if (DISCIPLINA_ATIVA) params.set("disciplina", DISCIPLINA_ATIVA);
      const q = params.toString();
      const r = await fetch(`/api/aluno/estado${q ? "?" + q : ""}`);
      if (r.status === 401) {
        window.location.href = "/login";
        return;
      }
      ESTADO = await r.json();
      if (ESTADO && ESTADO.disciplina_ativa && ESTADO.disciplina_ativa.id) {
        DISCIPLINA_ATIVA = ESTADO.disciplina_ativa.id;
      }
      renderizarTudo(forcar);
    }

    function trocarDisciplinaAluno(discId) {
      if (!discId || discId === DISCIPLINA_ATIVA) return;
      pararCronometroVisual();
      limparArquivoSelecionado(false);
      pararJobPolling();
      DISCIPLINA_ATIVA = discId;
      jobAtivo = carregarJobStorage();
      recarregarEstado(discId, true).then(() => {
        if (jobAtivo && ["arquivo_recebido", "lendo_e_corrigindo"].includes(jobAtivo.etapa)) {
          iniciarJobPolling(jobAtivo.job_id);
        }
      });
    }

    function abrirFolha() {
      if (!ESTADO || !ESTADO.prova_atual) return;
      window.open(`/folha/${encodeURIComponent(ESTADO.prova_atual.protocolo)}`, "_blank");
    }

    async function iniciarCronometro() {
      if (!ESTADO || !ESTADO.prova_atual) return;
      const btn = document.getElementById("btn-iniciar-cron");
      if (btn) btn.disabled = true;
      const r = await fetch("/api/iniciar-cronometro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ protocolo: ESTADO.prova_atual.protocolo }),
      });
      if (!r.ok) {
        const err = await r.json().catch(() => ({}));
        const msgEl = document.getElementById("msg-cronometro");
        if (msgEl) {
          msgEl.className = "status-inline err";
          msgEl.textContent = err.erro || "Não foi possível iniciar o cronômetro.";
        }
        if (btn) btn.disabled = false;
        return;
      }
      await recarregarEstado(DISCIPLINA_ATIVA, true);
    }

    async function encerrarCronometro() {
      if (!ESTADO || !ESTADO.prova_atual) return;
      const btn = document.getElementById("btn-encerrar-cron");
      if (btn) btn.disabled = true;
      const seg = cronInterval ? Math.max(1, cronBaseSeg + Math.floor((Date.now() - cronAnchorMs) / 1000)) : null;
      pararCronometroVisual();
      const r = await fetch("/api/encerrar-cronometro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          protocolo: ESTADO.prova_atual.protocolo,
          tempo_decorrido_seg: seg,
        }),
      });
      if (!r.ok) {
        const p = await r.json().catch(() => ({}));
        const msgEl = document.getElementById("msg-cronometro");
        if (msgEl) {
          msgEl.className = "status-inline err";
          msgEl.textContent = p.erro || "Não foi possível salvar o tempo.";
        }
        if (btn) btn.disabled = false;
        return;
      }
      await recarregarEstado(DISCIPLINA_ATIVA, true);
    }

    function acionarSeletorArquivo() {
      const inp = document.getElementById("input-arquivo");
      if (inp) inp.click();
    }

    function limparArquivoSelecionado(rerender = true) {
      if (selectedPreviewUrl) {
        URL.revokeObjectURL(selectedPreviewUrl);
        selectedPreviewUrl = "";
      }
      selectedFile = null;
      if (rerender) renderizarTudo(true);
    }

    function aoSelecionarArquivo(inp) {
      if (!inp.files || !inp.files[0]) return;
      if (selectedPreviewUrl) URL.revokeObjectURL(selectedPreviewUrl);
      selectedFile = inp.files[0];
      selectedPreviewUrl = selectedFile.type.startsWith("image/") ? URL.createObjectURL(selectedFile) : "";
      const selEl = document.getElementById("sel-protocolo");
      selectedProtocolo = (selEl && selEl.value) || (ESTADO.prova_atual ? ESTADO.prova_atual.protocolo : "");
      renderizarTudo(true);
    }

    function pararJobPolling() {
      if (jobPollTimer) {
        clearTimeout(jobPollTimer);
        jobPollTimer = null;
      }
    }

    function iniciarJobPolling(jobId) {
      pararJobPolling();
      const tick = async () => {
        try {
          const r = await fetch(`/api/submissoes/status/${encodeURIComponent(jobId)}`);
          if (r.status === 404) {
            jobAtivo = null;
            salvarJobStorage(null);
            await recarregarEstado(DISCIPLINA_ATIVA, true);
            return;
          }
          if (!r.ok) {
            jobPollTimer = setTimeout(tick, 2000);
            return;
          }
          const st = await r.json();
          jobAtivo = st;
          salvarJobStorage(st);
          renderizarTudo(true);
          if (st.etapa === "concluido") {
            limparArquivoSelecionado(false);
            salvarJobStorage(null);
            await recarregarEstado(DISCIPLINA_ATIVA, true);
            ativarAba("resultados");
            jobAtivo = null;
            renderizarTudo(true);
            return;
          }
          if (st.etapa === "erro") {
            salvarJobStorage(null);
            return;
          }
          jobPollTimer = setTimeout(tick, 1200);
        } catch (_err) {
          jobPollTimer = setTimeout(tick, 2500);
        }
      };
      jobPollTimer = setTimeout(tick, 900);
    }

    async function enviarArquivoBinario() {
      if (!selectedFile) return;
      const selEl = document.getElementById("sel-protocolo");
      const prot = selectedProtocolo || (selEl && selEl.value) || (ESTADO.prova_atual ? ESTADO.prova_atual.protocolo : "");
      jobAtivo = {
        job_id: "",
        etapa: "enviando",
        mensagem: `Enviando ${selectedFile.name} (${formatarBytes(selectedFile.size)})...`,
        erro: "",
      };
      renderizarTudo(true);

      try {
        const r = await fetch("/api/submeter-foto-binario", {
          method: "POST",
          headers: {
            "X-Prep-Filename": encodeURIComponent(selectedFile.name),
            "X-Prep-Protocolo": encodeURIComponent(prot),
            "X-Prep-Disciplina": encodeURIComponent(DISCIPLINA_ATIVA),
            "Content-Type": selectedFile.type || "application/octet-stream",
          },
          body: selectedFile,
        });
        const res = await r.json();
        if (!r.ok || !res.ok) {
          jobAtivo = { etapa: "erro", erro: res.erro || "Falha ao enviar o arquivo." };
          renderizarTudo(true);
          return;
        }
        jobAtivo = res;
        salvarJobStorage(res);
        renderizarTudo(true);
        iniciarJobPolling(res.job_id);
      } catch (_err) {
        jobAtivo = { etapa: "erro", erro: "Falha de conexão ao enviar o arquivo. Tente novamente." };
        renderizarTudo(true);
      }
    }

    async function sair() {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login";
    }

    jobAtivo = carregarJobStorage();
    renderizarTudo(true);
    if (jobAtivo && jobAtivo.job_id && ["arquivo_recebido", "lendo_e_corrigindo"].includes(jobAtivo.etapa)) {
      iniciarJobPolling(jobAtivo.job_id);
    }

    setInterval(() => {
      if (document.visibilityState === "visible" && !(jobAtivo && ["enviando", "arquivo_recebido", "lendo_e_corrigindo"].includes(jobAtivo.etapa))) {
        recarregarEstado(DISCIPLINA_ATIVA, false);
      }
    }, 15000);
  </script>
</body>
</html>
